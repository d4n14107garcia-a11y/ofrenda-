<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Veladora</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);
    import {RoundedBoxGeometry} from "./js/RoundedBoxGeometry.js"

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 25);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

// Grids
var gridHelper = new THREE.GridHelper(200,200);
scene.add(gridHelper);



//ejes
var axes = new THREE.AxesHelper(100);
scene.add(axes);
 

// Espacio para colocar los objetos

///  💫💢🐭🐭 LUCES
var ligth3 = new THREE.HemisphereLight(0xffffff, 0x000000, 1.5);
scene.add(ligth3); // Opcional: descomentar para iluminar las zonas oscuras



//OBJETOS  ✏️✏️✏️✏️  🪶

//baso de vela 
var geometry3 = new THREE.CylinderGeometry(11,5,11,30,90);
var material3 = new THREE.MeshPhysicalMaterial({
    color: 0xDBD4CE,
    transmission: 1,  
    opacity: 1,       
    transparent: true,
    roughness: 0.1,   
    ior: 1.5,         
    thickness: 0.5
})
var mesh3 = new THREE.Mesh(geometry3,material3);
scene.add(mesh3);
mesh3.position.set(0,6,0);

var geometry2 = new THREE.CylinderGeometry(9,3,10,30,90);
var material2 = new THREE.MeshPhongMaterial({
    color: 0xDBD4CE,
    side: THREE.DoubleSide,
   //wireframe: true 
})
var mesh2 = new THREE.Mesh(geometry2,material2);
scene.add(mesh2);
mesh2.position.set(0,7,0);

var geometry4 = new THREE.BoxGeometry(0.5,3,0.5,1);
var material4 = new THREE.MeshBasicMaterial({
    color: 0xDBCCBD,
    side: THREE.DoubleSide,
   //wireframe: true 
})
var mesh4 = new THREE.Mesh(geometry4,material4);
scene.add(mesh4);
mesh4.position.set(0,13,0);

var geometry5 = new THREE.ConeGeometry(1,3,20,50,200);
var material5 = new THREE.MeshPhysicalMaterial({
    color: 0xA6880F,
   //wireframe: true
    
})
var mesh5 = new THREE.Mesh(geometry5,material5);
mesh5.castShadow = true; 
mesh5.receiveShadow = true; 
scene.add(mesh5);
mesh5.position.set(0,15,0);

var vela = new THREE.Group();
vela.add(mesh2,mesh3,mesh4,mesh5);
vela.position.set(-30,0,0);
scene.add(vela);


//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {
    //🪄🪄 Animación - 





    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();
    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
