<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>pan de muerto</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);
    import {RoundedBoxGeometry} from "./js/RoundedBoxGeometry.js"

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 25);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
//🎶 Grids
 


// Ejes




//colocar los objetos


// Pan de Muerto
var geoPanBase = new THREE.SphereGeometry(3, 32, 16);
var matPan = new THREE.MeshBasicMaterial({ color: 0xc68a4c });
var meshPanBase = new THREE.Mesh(geoPanBase, matPan);
meshPanBase.scale.set(1, 0.5, 1);
meshPanBase.position.set(10, 1.5, 0);
scene.add(meshPanBase);

var geoPanBolita = new THREE.SphereGeometry(0.6, 16, 16);
var meshPanBolita = new THREE.Mesh(geoPanBolita, matPan);
meshPanBolita.position.set(10, 3, 0);
scene.add(meshPanBolita);

var geoHueso1 = new THREE.CylinderGeometry(0.2, 0.2, 5, 16);
var meshHueso1 = new THREE.Mesh(geoHueso1, matPan);
meshHueso1.rotation.z = Math.PI / 2;
meshHueso1.position.set(10, 2.6, 0);
scene.add(meshHueso1);

var geoHueso2 = new THREE.CylinderGeometry(0.2, 0.2, 5, 16);
var meshHueso2 = new THREE.Mesh(geoHueso2, matPan);
meshHueso2.rotation.x = Math.PI / 2;
meshHueso2.position.set(10, 2.6, 0);
scene.add(meshHueso2);


///  💫💢🐭🐭 LUCES
 



//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {
    //🪄🪄 Animación - 





    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();
    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
